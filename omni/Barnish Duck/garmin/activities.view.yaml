# Reference this view as garmin__activities
label: Activities

schema: garmin
table_name: activities

dimensions:
  start_time_local: {}
  distance_meters: {}
  duration_seconds: {}
  moving_seconds: {}
  calories: {}
  average_hr: {}
  max_hr: {}
  aerobic_effect: {}
  anaerobic_effect: {}
  training_load: {}
  elevation_gain_meters: {}
  elevation_loss_meters: {}
  steps: {}
  avg_speed_mps: {}
  max_speed_mps: {}
  avg_power: {}
  norm_power: {}
  avg_cadence: {}
  moderate_intensity_min: {}
  vigorous_intensity_min: {}
  fastest_mile_seconds: {}
  fastest_100m_seconds: {}

  activity_id:
    label: Activity ID
    format: ID
    primary_key: true

  activity_name:
    label: Activity

  activity_type:
    label: Type

  calendar_date:
    label: Date

  sport:
    sql: sport
    label: Sport

  bike_cadence:
    sql: bike_cadence
    label: Bike cadence

  swim_cadence:
    sql: swim_cadence
    label: Swim cadence

  swolf:
    sql: swolf
    label: SWOLF

  strokes:
    sql: strokes
    label: Strokes

  stride_length_cm:
    sql: stride_length_cm
    label: Stride length (cm)

  ground_contact_ms:
    sql: ground_contact_ms
    label: Ground contact (ms)

  vertical_oscillation_cm:
    sql: vertical_oscillation_cm
    label: Vertical oscillation (cm)

  fastest_1k_seconds:
    sql: fastest_1k_seconds
    label: Fastest kilometer (sec)

  hr_zone_1_seconds:
    sql: hr_zone_1_seconds

  hr_zone_2_seconds:
    sql: hr_zone_2_seconds

  hr_zone_3_seconds:
    sql: hr_zone_3_seconds

  hr_zone_4_seconds:
    sql: hr_zone_4_seconds

  hr_zone_5_seconds:
    sql: hr_zone_5_seconds

  fastest_1k_minutes:
    sql: CASE WHEN ${fastest_mile_seconds} > 0 THEN ${fastest_mile_seconds} /
      86400.0 END
    label: Fastest mile

  pace_min_per_km:
    sql: CASE WHEN ${avg_speed_mps} > 0.3 THEN (1609.344 / ${avg_speed_mps}) /
      86400.0 END
    label: Pace

  speed_kmh:
    sql: CASE WHEN ${avg_speed_mps} > 0.3 THEN ${avg_speed_mps} * 2.236936 END
    label: Speed (mph)

  swim_pace_min_per_100m:
    sql: CASE WHEN ${avg_speed_mps} >= 0.4 AND ${avg_speed_mps} <= 2.2 THEN (91.44 /
      ${avg_speed_mps}) / 86400.0 END
    label: Pace

measures:
  count:
    label: Activities
    aggregate_type: count

  total_distance_km:
    sql: ${distance_meters} / 1609.344
    label: Distance (mi)
    format: NUMBER_1
    aggregate_type: sum

  total_hours:
    sql: ${duration_seconds} / 3600.0
    label: Hours
    format: NUMBER_1
    aggregate_type: sum

  total_calories:
    sql: ${calories}
    label: Calories
    format: NUMBER_0
    aggregate_type: sum

  avg_heart_rate:
    sql: ${average_hr}
    label: Average heart rate
    format: NUMBER_0
    aggregate_type: average

  total_training_load:
    sql: ${training_load}
    label: Training load
    format: NUMBER_0
    aggregate_type: sum

  avg_pace_min_per_km:
    sql: ${pace_min_per_km}
    label: Pace
    format: "[m]:ss"
    aggregate_type: average

  avg_speed_kmh:
    sql: ${speed_kmh}
    label: Speed (mph)
    format: NUMBER_1
    aggregate_type: average

  avg_swim_pace:
    sql: ${swim_pace_min_per_100m}
    label: Pace
    format: "[m]:ss"
    aggregate_type: average

  heart_rate:
    sql: NULLIF(${average_hr}, 0)
    label: Heart rate
    format: NUMBER_0
    aggregate_type: average

  zone_1_minutes:
    sql: ${hr_zone_1_seconds} / 60.0
    label: Zone 1
    format: NUMBER_0
    aggregate_type: sum

  zone_2_minutes:
    sql: ${hr_zone_2_seconds} / 60.0
    label: Zone 2
    format: NUMBER_0
    aggregate_type: sum

  zone_3_minutes:
    sql: ${hr_zone_3_seconds} / 60.0
    label: Zone 3
    format: NUMBER_0
    aggregate_type: sum

  zone_4_minutes:
    sql: ${hr_zone_4_seconds} / 60.0
    label: Zone 4
    format: NUMBER_0
    aggregate_type: sum

  zone_5_minutes:
    sql: ${hr_zone_5_seconds} / 60.0
    label: Zone 5
    format: NUMBER_0
    aggregate_type: sum

  avg_run_cadence:
    sql: NULLIF(${avg_cadence}, 0)
    label: Cadence
    format: NUMBER_0
    aggregate_type: average

  avg_power_w:
    sql: NULLIF(${avg_power}, 0)
    label: Power (W)
    format: NUMBER_0
    aggregate_type: average

  avg_swolf:
    sql: CASE WHEN ${swolf} BETWEEN 15 AND 120 THEN ${swolf} END
    label: SWOLF
    format: NUMBER_0
    aggregate_type: average

  best_1k_minutes:
    sql: ${fastest_1k_minutes}
    label: Fastest mile
    format: "[m]:ss"
    aggregate_type: min
