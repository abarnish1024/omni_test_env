# Reference this view as wow__items
schema: wow
table_name: items

dimensions:
  name: {}
  quality_type: {}
  item_class: {}
  item_subclass: {}
  sell_price_copper: {}
  purchase_price_copper: {}
  is_equippable: {}
  is_stackable: {}
  item_level: {}
  is_crafting_reagent: {}
  description: {}
  updated_at: {}

  item_id:
    format: ID
    primary_key: true

  sell_price_gold:
    sql: ${sell_price_copper} / 10000.0
    label: Vendor Sell Price (Gold)
    format: number_2
    description: Price the vendor pays, converted from copper to gold.

  purchase_price_gold:
    sql: ${purchase_price_copper} / 10000.0
    label: Vendor Purchase Price (Gold)
    format: number_2
    description: Price to buy from a vendor, converted from copper to gold.

measures:
  count:
    aggregate_type: count
