- join_from_view: wow__listings
  join_to_view: wow__snapshots
  join_type: always_left
  on_sql: ${wow__listings.snapshot_id} = ${wow__snapshots.snapshot_id}
  relationship_type: assumed_many_to_one

- join_from_view: wow__listings
  join_to_view: wow__items
  join_type: always_left
  on_sql: ${wow__listings.item_id} = ${wow__items.item_id}
  relationship_type: assumed_many_to_one

- join_from_view: wow__my_trades
  join_to_view: wow__items
  join_type: always_left
  on_sql: ${wow__my_trades.item_id} = ${wow__items.item_id}
  relationship_type: assumed_many_to_one

- join_from_view: main__races
  join_to_view: main__circuits
  join_type: always_left
  on_sql: ${main__races.circuit_id} = ${main__circuits.circuit_id}
  relationship_type: many_to_one
