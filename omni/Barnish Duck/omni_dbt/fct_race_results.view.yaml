# Reference this view as omni_dbt__fct_race_results
schema_label: ""
#This description was pulled from dbt.
description: Race results joined to race and driver attributes. `race_points` is
  championship points (renamed from `points`).

schema: omni_dbt
table_name: fct_race_results

dimensions:
  race_name: {}
  race_year: {}
  race_date: {}
  driver_name: {}
  driver_nationality: {}
  grid: {}
  finish_position: {}
  points_collected: {}

  result_id:
    format: ID

  race_id:
    format: ID

  driver_id:
    format: ID

  race_laps:
    #This description was pulled from dbt.
    description: Number of laps completed in the race. Renamed from `laps` so Omni
      Content Validator can show downstream blast radius.

measures:
  count:
    aggregate_type: count

#The info below was pulled from your dbt repository and is read-only.
dbt:
  name: fct_race_results
  target_schema: main
  description: Race results joined to race and driver attributes. `race_points` is
    championship points (renamed from `points`).
  config:
    materialized: table
  code: |-
    select
      results.result_id,
      results.race_id,
      results.driver_id,
      races.race_name,
      races.race_year,
      races.race_date,
      drivers.driver_name,
      drivers.nationality as driver_nationality,
      results.grid,
      results.finish_position,
      results.points as points_collected,
      results.laps as race_laps
    from {{ ref('stg_results') }} as results
    left join {{ ref('stg_races') }} as races
      on results.race_id = races.race_id
    left join {{ ref('stg_drivers') }} as drivers
      on results.driver_id = drivers.driver_id
