# Reference this view as main__results
schema: main
table_name: results

dimensions:
  number: {}
  grid: {}
  position: {}
  points: {}
  laps: {}
  time: {}
  milliseconds: {}
  rank: {}

  result_id:
    sql: '"resultId"'
    format: ID

  race_id:
    sql: '"raceId"'
    format: ID

  driver_id:
    sql: '"driverId"'
    format: ID

  constructor_id:
    sql: '"constructorId"'
    format: ID

  position_text:
    sql: '"positionText"'

  position_order:
    sql: '"positionOrder"'

  fastest_lap:
    sql: '"fastestLap"'

  fastest_lap_time:
    sql: '"fastestLapTime"'

  fastest_lap_speed:
    sql: '"fastestLapSpeed"'

  status_id:
    sql: '"statusId"'
    format: ID

measures:
  count:
    aggregate_type: count
