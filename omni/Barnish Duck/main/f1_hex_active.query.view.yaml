# Reference this view as main__f1_hex_active
schema: main
sql: |
  SELECT *
  FROM main__f1_hex_grid
  WHERE circuit_count > 0

dimensions:
  h3_cell_id:
    primary_key: true

  h3_center_lat:
    label: H3 Center Lat

  h3_center_lng:
    label: H3 Center Lng

  hex_geojson:
    label: Hex GeoJSON

  circuit_count:
    label: Circuit Count
    format: number_0

measures:
  hex_cell_count:
    label: Hex Cells
    aggregate_type: count
