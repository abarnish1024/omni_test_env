  teamid: {}
  firstblood: {}
  firsttower: {}
  firstinhib: {}
  firstbaron: {}
  firstdragon: {}
  firstharry: {}
  towerkills: {}
  inhibkills: {}
  baronkills: {}
  dragonkills: {}
  harrykills: {}

measures:
  count:
    aggregate_type: count
