# Reference this view as main__fct_race_results
#This description was pulled from dbt.
description: Race results joined to race and driver attributes. `points` is the
  demo rename/deprecation field.

schema: main
table_name: fct_race_results

dimensions:
  race_name: {}
  race_year: {}
  race_date: {}
  driver_name: {}
  driver_nationality: {}
  grid: {}
  finish_position: {}
  laps: {}

  result_id:
    format: ID

  race_id:
    format: ID

  driver_id:
    format: ID

  points:
    #This description was pulled from dbt.
    description: Championship points for the result. Rename to race_points in a
      feature PR to demonstrate Omni Content Validator blast radius.

measures:
  count:
    aggregate_type: count

#The info below was pulled from your dbt repository and is read-only.
dbt:
  name: fct_race_results
  target_schema: main
  description: Race results joined to race and driver attributes. `points` is the
    demo rename/deprecation field.
  config:
    materialized: table
  code: |-
    select
      results.result_id,
      results.race_id,
      results.driver_id,
      races.race_name,
      races.race_year,
      races.race_date,
      drivers.driver_name,
      drivers.nationality as driver_nationality,
      results.grid,
      results.finish_position,
      results.points,
      results.laps
    from {{ ref('stg_results') }} as results
    left join {{ ref('stg_races') }} as races
      on results.race_id = races.race_id
    left join {{ ref('stg_drivers') }} as drivers
      on results.driver_id = drivers.driver_id
