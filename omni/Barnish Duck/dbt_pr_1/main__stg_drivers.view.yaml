# Reference this view as main__stg_drivers
#This description was pulled from dbt.
description: Cleaned driver attributes

schema: dbt_pr_1
table_name: stg_drivers

dimensions:
  driver_ref: {}
  driver_code: {}
  forename: {}
  surname: {}
  driver_name: {}
  date_of_birth: {}
  nationality: {}

  driver_id:
    format: ID

measures:
  count:
    aggregate_type: count

#The info below was pulled from your dbt repository and is read-only.
dbt:
  name: stg_drivers
  target_schema: main
  description: Cleaned driver attributes
  config:
    materialized: view
  code: |-
    select
      "driverId" as driver_id,
      "driverRef" as driver_ref,
      "code" as driver_code,
      "forename" as forename,
      "surname" as surname,
      trim(coalesce("forename", '') || ' ' || coalesce("surname", '')) as driver_name,
      "dob" as date_of_birth,
      "nationality" as nationality
    from {{ source('f1', 'drivers') }}
  referenced_by: [ dim_drivers, fct_race_results ]
